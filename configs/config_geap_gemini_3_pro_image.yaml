api:
  type: chat
  streaming: true
  headers: null
  slo_unit: null
  slo_tpot_header: null
  slo_ttft_header: null
  response_format: null
  session_id_header_key: null
data:
  type: synthetic
  input_distribution: { type: uniform, min: 100, max: 500, mean: 250 }
  output_distribution: { type: uniform, min: 50, max: 200, mean: 100 }
  multimodal:
    image:
      # 1–3 images per request, typically 2.
      count: { type: uniform, min: 1, max: 3, mean: 2 }
      # Place images at the start of the prompt (0.0). Use 1.0 for suffix
      # placement, or a Distribution to vary placement per request.
      insertion_point: 0.0
      # Mix 1080p (most requests) with occasional 4K.
      resolutions:
        - resolution: "1080p"
          weight: 0.8
        - resolution: "4k"
          weight: 0.2

load:
  num_workers: 1
  type: constant
  interval: 1.0
  stages:
  - rate: 1.0
    duration: 20          # Stage 0: 20 requests
    num_requests: null
    concurrency_level: null
  - rate: 2.0
    duration: 20          # Stage 1: 40 requests
    num_requests: null
    concurrency_level: null
  - rate: 3.0
    duration: 15          # Stage 2: 45 requests (Total: 105 requests)
    num_requests: null
    concurrency_level: null
  sweep: null
  worker_max_concurrency: 5
  worker_max_tcp_connections: 50
  trace: null
  circuit_breakers: []
  request_timeout: null
  lora_traffic_split: null
  base_seed: 1782978773116
metrics: null
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: true
    per_adapter: true
    per_adapter_stage: false
    percentiles:
    - 0.1
    - 1.0
    - 5.0
    - 10.0
    - 25.0
    - 50.0
    - 75.0
    - 90.0
    - 95.0
    - 99.0
    - 99.9
storage:
  local_storage:
    path: reports_geap
    report_file_prefix: geap_gemini_3_pro_image_
  google_cloud_storage: null
  simple_storage_service: null
server:
  type: vllm
  model_name: google/gemini-3-pro-image
  base_url: http://127.0.0.1:8000/geap
  ignore_eos: false
  api_key: null
  cert_path: null
  key_path: null
tokenizer:
  pretrained_model_name_or_path: ./tokenizers/gemma-4-31B-it
  trust_remote_code: null
  token: null
circuit_breakers: null
